<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadline Tracker</title>
  <link rel="stylesheet" href="style/main.css" />
</head>

<body>
  <main>
    <div class="date-picker-container">
      <h3>To begin, enter a deadline that stresses you out:</h3>
      <form id="date-input-form">
        <input type="datetime-local" name="deadlineDate" required />
        <input type="text" name="deadlineTitle" placeholder="Deadline name..." maxlength="50" required />
        <button type="submit">Submit</button>
      </form>
    </div>

    <div id="countdowns">
      <div id="countdown-container"></div>
    </div>
  </main>

  <template id="screen-template">
    <div class="screen">
      <h3 class="screen-title"></h3>
      <p class="screen-counter"></p>
    </div>
  </template>
  <template id="link-container-template">
    <div class="screen">
      <div class="link-container">
        <a href="https://mavirgil.com" target="_blank">Contact</a>
        <p>|</p>
        <a href="https://github.com/MaVirgil/deadline-tracker" target="_blank">GitHub</a>
      </div>
    </div>
  </template>
  <script type="module" src="script/main.js"></script>
</body>
</html>
