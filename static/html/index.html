<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadline tracker</title>
  </head>
  <body>

    <main>
      <div class="date-picker-container">
        <h3>To begin, enter a deadline that stresses you out:</h3>
        <form id="date-input-form" >
          <input type="datetime-local" required />
          <input type="text" placeholder="Deadline name..." maxlength="20" required/>
          <button type="submit">Submit</button>
        </form>
      </div>

      <div id="countdowns">
        <h2 id="countdown-header"></h2>
        <div id="countdown-container">

        </div>
      </div>
    </main>
  </body>
  <script>
    const deadlineFormElement = document.getElementById('date-input-form');
    deadlineFormElement.addEventListener("submit", handleDeadlineSubmit);

    const deadline = {};

    function handleDeadlineSubmit(event) {
      event.preventDefault();
      deadline.dateTime = new Date(event.target[0].value);
      deadline.text = event.target[1].value;
      console.log(deadline);

      if (deadline.dateTime.getTime() - Date.now() < 5 * 60 * 1000) {
        alert('Please specify a deadline at least 5 minutes into the future');
        return;
      }
    }

  </script>

  <style>
    html {
      background-color: oklch(0.8798 0.0598 132.35);
      color: oklch(24.935% 0.0225 41.943);
      font-family: sans-serif;
    }
    body {
      text-align: center;
      margin: 0 auto;
      max-width: 650px;
      min-height: 100vh;
      background-color: rgba(248, 235, 227, 0.4);
      background-blend-mode: overlay;
      border-radius: 2em;
    }
    @media (max-width: 650px ) {
      body {
        border-radius: 0;
      }
      
    }
    main {
      margin-top: 2em;
      padding-top: 2em;
      padding-bottom: 2em;
      padding-left: 3em;
      padding-right: 3em;
    }
    .date-picker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #date-input-form {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }
  
  </style>
</html>
